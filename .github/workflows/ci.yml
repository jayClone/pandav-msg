name: pandav-msg

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-check:
    name: Backend Build & Security Check
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      #  Secret detection - scan filesystem only if you want to add secrets on your github :)
      # - name: Detect secrets (backend)
      #   uses: trufflesecurity/trufflehog@main
      #   with:
      #     path: ./backend
      #     extra_args: --only-verified

      - name: Install backend dependencies
        run: |
          cd backend
          bun install

      - name: Security audit
        run: |
          cd backend
          npm audit --audit-level=moderate || true

      - name: Run backend tests
        run: |
          cd backend
          bun run test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/pandav_chat_test
          JWT_SECRET: test_secret_key_min_32_chars_long_123
          JWT_REFRESH_SECRET: test_refresh_secret_key_min_32_chars_456
          JWT_ACCESS_EXPIRE: 15m
          JWT_REFRESH_EXPIRE: 30d
          API_VERSION: v1
          CLIENT_URL: http://localhost:5173
          OTP_EXPIRY_MINUTES: 10
          OTP_MAX_ATTEMPTS: 5
          RESEND_API_KEY: re_test_dummy_key_123
          RESEND_FROM_EMAIL: test@example.com
          RESEND_FROM_NAME: Test

      - name: Backend build check
        run: |
          cd backend
          bun run build || echo "No build script"

  frontend-check:
    name: Frontend Build & Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      #  Secret detection - scan filesystem only - if you want to add secrets on your github :)
      # - name: Detect secrets (frontend)
      #   uses: trufflesecurity/trufflehog@main
      #   with:
      #     path: ./frontend
      #     extra_args: --only-verified

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install

      - name: Security audit
        run: |
          cd frontend
          npm audit --audit-level=moderate || true

      - name: Run frontend tests
        run: |
          cd frontend
          bun run test:run

      - name: Frontend build check
        run: |
          cd frontend
          bun run build

  android-build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    needs: [frontend-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships with the Android SDK and its licenses already
      # installed (see actions/runner-images) — no separate SDK setup step
      # is needed, and android-actions/setup-android@v3 fails outright here
      # (it tries to install the long-removed legacy "tools" package).

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install

      - name: Build web assets
        run: |
          cd frontend
          bun run build

      - name: Sync Capacitor Android project
        run: |
          cd frontend
          bunx cap sync android

      - name: Build debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # android/build.gradle redirects Gradle's buildDir to a temp folder
      # (a workaround for this project living in a OneDrive-synced folder
      # during local dev) — the APK lands there instead of the usual
      # android/app/build/outputs path, on any OS/runner.
      - name: Locate built APK
        id: locate_apk
        run: |
          APK_PATH=$(find "${TMPDIR:-/tmp}" -iname "*.apk" -path "*outputs/apk*" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found under the redirected build directory" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pandav-msg-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 14

  all-checks-pass:
    name: All Checks Status
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check, android-build]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.backend-check.result }}" == "failure" || \
                "${{ needs.frontend-check.result }}" == "failure" || \
                "${{ needs.android-build.result }}" == "failure" ]]; then
            echo "❌ One or more checks failed!"
            exit 1
          fi
          echo "✅ All checks passed!"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Pull latest and rebuild on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/pandav-msg
            git pull origin main
            docker compose build
            docker compose up -d

      - name: Verify deployment is healthy
        run: |
          sleep 8
          curl -sf https://pandav.jaychaudhari.me/api/v1/health || exit 1
