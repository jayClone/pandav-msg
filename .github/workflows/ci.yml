name: pandav-msg

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]

jobs:
  backend-check:
    name: Backend Build & Security Check
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # ✅ Secret detection
      - name: Detect secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./backend
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Install backend dependencies
        run: |
          cd backend
          bun install

      - name: Security audit
        run: |
          cd backend
          npm audit --audit-level=moderate || true

      # ✅ SIMPLE: Use GitHub secrets in tests
      - name: Run Backend Tests
        run: |
          cd backend
          bun test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/pandav_chat_test  # ✅ Local DB for tests
          JWT_SECRET: test_secret_key_min_32_chars_long_!@#$%^&*
          JWT_EXPIRE: 7d
          API_VERSION: v1
          CLIENT_URL: http://localhost:5173

      - name: Backend build check
        run: |
          cd backend
          bun run build || echo "No build script"

  frontend-check:
    name: Frontend Build & Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Detect secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./frontend
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install

      - name: Security audit
        run: |
          cd frontend
          npm audit --audit-level=moderate || true

      - name: Run frontend tests
        run: |
          cd frontend
          bun run test:run

      - name: Frontend build check
        run: |
          cd frontend
          bun run build

  all-checks-pass:
    name: All Checks Status
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.backend-check.result }}" == "failure" || \
                "${{ needs.frontend-check.result }}" == "failure" ]]; then
            echo "❌ One or more checks failed!"
            exit 1
          fi
          echo "✅ All checks passed!"
