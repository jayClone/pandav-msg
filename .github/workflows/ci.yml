name: pandav-msg

on:
  push:
    branches: [devlopment]
  pull_request:
    branches: [devlopment, main]

jobs:
  backend-check:
    name: Backend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          node-version: latest

      - name: Install backend dependencies
        run: |
          cd backend
          bun install

      - name: Run Backend Test
        run: |
          cd backend
          bun test

      - name: Backend build check
        run: |
          cd backend
          bun run build || echo "No build script, skipping"

  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: oven-sh/setup-bun@v1
        with:
          node-version: latest

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install

      - name: Frontend build check
        run: |
          cd frontend
          bun run build
