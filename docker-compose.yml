services:
  # ✅ Local MongoDB
  mongo:
    image: mongo:7
    container_name: pandav-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - pandav-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ✅ Local Redis
  redis:
    image: redis:7-alpine
    container_name: pandav-redis
    volumes:
      - redis-data:/data
    networks:
      - pandav-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ✅ Backend Service - Local MongoDB & Redis
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pandav-backend
    env_file:
      - backend/.env
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pandav-network
    healthcheck:
      test: ["CMD", "bun", "-e", "const res = await fetch('http://localhost:5000/api/v1/health'); process.exit(res.ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ✅ Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: pandav-frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pandav-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pandav-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data: