version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: pandav-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pandav_chat
    volumes:
      - mongo_data:/data/db
    networks:
      - pandav-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: pandav-backend
    ports:
      - "5000:5000"
    environment:
      # ✅ Use .env file for local development ONLY
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/pandav_chat}
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
      JWT_EXPIRE: 7d
      NODE_ENV: ${NODE_ENV:-development}
      API_VERSION: v1
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    depends_on:
      - mongodb
    networks:
      - pandav-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: pandav-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    depends_on:
      - backend
    networks:
      - pandav-network
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  pandav-network:
    driver: bridge